<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ARYAA — Matchstick Animation</title>
  <link rel="stylesheet" href="matchsticks.css" />
</head>
<body>

  <div class="word">

    <div class="letter a">
      <div class="match left"></div>
      <div class="match right"></div>
      <div class="match center"></div>
    </div>

    <div class="letter r">
      <div class="match left-vertical"></div>
      <div class="match right-vertical"></div>
      <div class="match top"></div>
      <div class="match middle"></div>
      <div class="match leg"></div>
    </div>

    <div class="letter y">
      <div class="match left-diag"></div>
      <div class="match right-diag"></div>
      <div class="match stem"></div>
    </div>

    <div class="letter a2">
      <div class="match left"></div>
      <div class="match right"></div>
      <div class="match center"></div>
    </div>

    <div class="letter a3">
      <div class="match left"></div>
      <div class="match right"></div>
      <div class="match center"></div>
    </div>

  </div>

</body>
</html>
